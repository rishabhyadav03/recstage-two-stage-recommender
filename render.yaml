services:
  - type: web
    name: recstage-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: BUILD_SHA
        value: "render"
