version: '3.8'

services:
  recommendation-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recstage-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount artifacts and data so models can be re-trained or inspected outside the container
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
